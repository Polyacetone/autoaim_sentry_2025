%YAML:1.0
---

# 均采用国际单位制，距离为m，时间为s，角度为弧度

Tracker:
  initial_radius: 0.26
  initial_height: -0.1
  min_radius: 0.2 # 用于更新惯性滤波的半径最小值
  max_radius: 0.6 # 用于更新惯性滤波的半径最大值 ##### 注意：0.6是为了适应贼大的靶车，实际上场应较小（0.35左右） #####
  switch_armor_angle: 1.0472 # 角度突变的阈值，用于判断小陀螺跟踪的装甲板是否切换。这里是60度对应的弧度
  close_radius_filter_ratio: 0.93 # 较近的装甲板对应半径的惯性滤波系数
  far_radius_filter_ratio: 0.98 # 较远的装甲板对应半径的惯性滤波系数
  close_height_filter_ratio: 0.6 # 较近的装甲板对应高度的惯性滤波系数
  far_height_filter_ratio: 0.8 # 较远的装甲板对应高度的惯性滤波系数
  antitop_palstance_threshold: 0.87266 # 启用反陀螺的角速度阈值。0.87266rad/s = 50deg/s
  antitop_can_shoot_angle: 0.5236 # 小陀螺时，shoot_flag置为true的角度最大值。0.5236rad = 30deg
  max_lost_frames: 20 # 最大的丢失帧数。超过就从TEMP_LOST变为LOST
  converge_frames: 10 # 收敛帧数。超过则从CONVERGING变为TRACKING

KFXYZ:
  process_noise_cov: !!opencv-matrix
    rows: 6
    cols: 6
    dt: f
    data: [ 1e-6,  0,  0,  0,  0,  0,
            0,  1e-6,  0,  0,  0,  0,
            0,  0,  1e-6,  0,  0,  0,
            0,  0,  0,  1e-3,  0,  0,
            0,  0,  0,  0,  1e-3,  0,
            0,  0,  0,  0,  0,  1e-3 ]

  measurement_noise_cov: !!opencv-matrix
    rows: 3
    cols: 3
    dt: f
    data: [ 1e-1,  0,  0,
            0,  1e-1,  0,
            0,  0,  1e-1 ]

KFYaw:
  process_noise_cov: !!opencv-matrix
    rows: 2
    cols: 2
    dt: f
    data: [ 1e-7,  0, 
            0,  1e-4 ]

  measurement_noise_cov: !!opencv-matrix
    rows: 1
    cols: 1
    dt: f
    data: [ 1e-2 ]

UKFXY:
  process_noise_cov: !!opencv-matrix
    rows: 4
    cols: 4
    dt: f
    data: [ 1e-6,  0,  0,  0,
            0,  1e-6,  0,  0,
            0,  0,  1e-3,  0,
            0,  0,  0,  1e-3 ]

  measurement_noise_cov: !!opencv-matrix
    rows: 2
    cols: 2
    dt: f
    data: [ 1e-1,  0,
            0,  1e-1 ]