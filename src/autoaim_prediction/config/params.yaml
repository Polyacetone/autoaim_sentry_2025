autoaim_prediction:
  ros__parameters:
    enable_print_state: true
    enable_debug: true
    debug_mode : false # false: Armor mode, true: Buff mode
    debug_prediction_time: 0.07 # 预测的时间，单位为秒。
    debug_target_color: 0 # 0: all 1: blue 2: red
    debug_target_armor: 3
    debug_buff_mode: 1 # 0: SMALL BUFF, 1: BIG BUFF, 2：COUNTER SMALL BUFF, 3: COUNTER BIG BUFF
    debug_bullet_speed: 30.0 # 单位: m/s

    armor_dir_angle: 0.2617993877991494 # 装甲板角度
    
    # 单位: m
    cam_to_gimbal_x: 0.0
    cam_to_gimbal_y: 0.09
    cam_to_gimbal_z: 0.09
    filter_distance: 6.0
    # 单位: degree
    imu_compensate_pitch: 1.3
    imu_compensate_yaw: 0.3

    t_delay: 0.098 # 单位: s

    camera_info_topic: "/camera/color/camera_info"
    detection_sub_topic: "/detection"
    comm_pub_topic: "/serial/comm_send"
    
    position_pub_topic: "/debug/position"